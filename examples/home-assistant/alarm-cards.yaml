type: vertical-stack
cards:
  - type: entities
    title: Alarm 1
    show_header_toggle: false
    entities:
      - entity: input_boolean.clock_radio_alarm_1_enabled
        name: Alarm 1
      - entity: input_select.clock_radio_alarm_1_type
        name: Type
      - entity: sensor.clock_radio_alarm_1_wake_time
        name: Wake Time 1
      - entity: input_number.clock_radio_alarm_1_hour
        name: Hour
      - entity: input_number.clock_radio_alarm_1_minute
        name: Minutes
      - entity: input_boolean.clock_radio_alarm_1_monday
