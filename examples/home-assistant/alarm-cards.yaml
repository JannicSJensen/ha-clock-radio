      - entity: input_boolean.clock_radio_alarm_1_tuesday
        name: Tuesday
      - entity: input_boolean.clock_radio_alarm_1_wednesday
        name: Wednesday
      - entity: input_boolean.clock_radio_alarm_1_thursday
        name: Thursday
      - entity: input_boolean.clock_radio_alarm_1_friday
        name: Friday
      - entity: input_boolean.clock_radio_alarm_1_saturday
        name: Saturday
      - entity: input_boolean.clock_radio_alarm_1_sunday
