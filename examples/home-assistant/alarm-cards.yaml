      - entity: input_number.clock_radio_alarm_1_volume
        name: Volume
      - entity: input_number.clock_radio_alarm_1_duration
        name: Duration
      - entity: timer.clock_radio_alarm_1
        name: Remaining
  - type: entities
    title: Alarm 2
    show_header_toggle: false
    entities:
      - entity: input_boolean.clock_radio_alarm_2_enabled
        name: Alarm 2
