        name: Monday
      - entity: input_boolean.clock_radio_alarm_2_tuesday
        name: Tuesday
      - entity: input_boolean.clock_radio_alarm_2_wednesday
        name: Wednesday
      - entity: input_boolean.clock_radio_alarm_2_thursday
        name: Thursday
      - entity: input_boolean.clock_radio_alarm_2_friday
        name: Friday
      - entity: input_boolean.clock_radio_alarm_2_saturday
        name: Saturday
      - entity: input_boolean.clock_radio_alarm_2_sunday
        name: Sunday
      - entity: input_number.clock_radio_alarm_2_volume
        name: Volume
      - entity: input_number.clock_radio_alarm_2_duration
        name: Duration
      - entity: timer.clock_radio_alarm_2
        name: Remaining
