title: Clock Radio
locale: en-GB
# Empty follows HA's time zone. Set e.g. Europe/Copenhagen to override the clock.
time_zone: ""

# Settings saves this section atomically. Existing legacy clock_24h and
# show_seconds settings still work when their corresponding clock keys are absent.
clock:
  layout: widget
  face: analog
  full_face: analog
  widget: calendar
  seconds: true
  second_hand: "30"
  time_format: automatic
  language: ""
  week_start: automatic
  weather_entity: ""
  night_mode: off
  night_entity: ""

# Legacy fields are still parsed, but the HA app's media_player option now
# selects the only speaker used for both Music and all alarms.
players: []
default_player: ""

# Use stream URLs or Home Assistant media-source:// IDs.
# Music Assistant library URIs also work with source: music_assistant.
stations: []
# stations:
#   - id: favourite
#     name: Favourite station
#     media_content_id: "https://your-station.example/live.mp3"
#     media_content_type: music
#     source: home_assistant
