<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Clock Radio</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/music.css">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="sr-only"><span id="connection" role="status">Connecting</span><span id="version"></span><span id="page-position" role="status"></span></div>
      <main class="stage">
        <section id="page-clock" class="page clock-page" aria-label="The Clock">
          <iframe id="clock-frame" title="Nightstand clock" src="about:blank"></iframe>
          <button id="fullscreen" class="clock-focus" type="button" aria-label="Toggle full screen">Full screen</button>
        </section>
        <section id="page-music" class="page" aria-label="Music overview" hidden></section>
        <section id="page-alarms" class="page settings-page" aria-label="Alarm configuration" hidden></section>
        <section id="page-settings" class="page settings-page" aria-label="Settings" hidden></section>
        <p id="initial-loading" class="initial-loading">Connecting to Home Assistant...</p>
        <div id="page-indicator" class="page-indicator" role="img" aria-label="Page position"></div>
      </main>
    </div>
    <div class="banners" aria-live="polite">
      <p id="demo-notice" class="banner banner--info" hidden>DEMO · Fictional speakers, music and alarms. No audio is played.</p>
      <p id="connection-error" class="banner" hidden></p>
      <p id="config-error" class="banner" hidden></p>
      <p id="clock-error" class="banner" hidden></p>
      <p id="missing-players" class="banner" hidden></p>
      <p id="read-only" class="banner banner--info" hidden>Read-only dashboard. Playback and settings changes are disabled.</p>
      <p id="command-error" class="banner" role="alert" hidden></p>
    </div>
    <div id="toasts" class="toasts" role="status"></div>
  </body>
</html>
