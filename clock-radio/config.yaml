name: Clock Radio
version: "0.17.0"
slug: clock_radio
url: https://github.com/JannicSJensen/ha-clock-radio
description: Nightstand clock, music overview and Home Assistant alarm settings
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8100
ingress_stream: true
panel_icon: mdi:radio
panel_title: Clock Radio
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Tablet clock radio dashboard (trusted LAN only)
map:
  - type: app_config
    read_only: false
    path: /config
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  media_player: ""
  weather_entity: ""
  sun_entity: sun.sun
  return_to_clock_minutes: 2
  log_level: info
  read_only: false
  music_assistant_url: ""
  music_assistant_token: ""
schema:
  media_player: str?
  weather_entity: str?
  sun_entity: str?
  return_to_clock_minutes: int(0,1440)
  log_level: list(debug|info|warning|error)
  read_only: bool
  music_assistant_url: str?
  music_assistant_token: password?
