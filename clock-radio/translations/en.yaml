configuration:
  media_player:
    name: Music and alarm speaker
    description: One HA media_player entity ID, for example media_player.sovevaerelse. Used for music and HA-backed alarms. Kiosk alarms use Kiosk's native alarm settings instead. Restart after changing; enabled HA schedules are paused while the HA speaker helper is updated, then restored, only with the HA alarm backend.
  weather_entity:
    name: Weather entity
    description: Optional HA weather entity ID, for example weather.forecast_home. Used by the weather widget and full-screen clock. Empty disables weather; configure this only here, not in dashboard settings. Restart after changing.
  sun_entity:
    name: Sun entity
    description: HA Sun entity ID used by Sun night mode, for example sun.sun. Empty uses sun.sun. Below the horizon enables night colors; above restores daytime colors. Select Sun mode in the dashboard settings and restart the app after changing this entity.
  return_to_clock_minutes:
    name: Return to clock after inactivity (minutes)
    description: Return from Alarm configuration, Music or Settings after this many minutes without touch, mouse, scroll or keyboard activity. Default 2; 0 disables it. Open dialogs and pending saves pause the timeout. Music continues and Settings drafts are retained. Restart after changing.
  log_level:
    name: Log level
    description: How much the app writes to its log. Restart after changing.
  read_only:
    name: Read-only
    description: Show clock, music and alarm states but reject playback, grouping and all settings changes. Restart after changing.
  alarm_backend:
    name: Alarm backend
    description: Default home_assistant preserves existing behavior. kiosk_satellite manages only Clock Radio alarms on the configured kiosk. Choose music and native buzzer tones in Clock Radio's alarm editor. New music selections use Music Assistant and its available speaker named show-01, without source/speaker controls. Existing saved music and inherited Kiosk defaults are preserved unless you select another item. Native tone fallback remains; standalone direct URLs are not supported. Existing HA schedules and unrelated native alarms are untouched. Switching back does NOT cancel native alarms; explicitly delete Clock Radio's native alarms before switching, or in Kiosk. Restart after changing.
  kiosk_satellite_url:
    name: Kiosk Satellite Remote Administration URL
    description: Used for native alarms, KS updates or proximity screen dimming with either alarm backend. Use the kiosk's LAN HTTP(S) origin, for example http://192.168.1.50:2324, not the secure-context proxy's localhost address. Remote Administration must be available. All tablets using this app target this one kiosk. Restart after changing.
  kiosk_satellite_token:
    name: Kiosk Satellite Remote API token
    description: Manual alternative to kiosk_satellite_password for native alarms, KS updates and proximity dimming with either alarm backend. Obtain a bearer token using Kiosk's POST /api/login endpoint and renew manually when expired. Ignored when a password is configured. Kept only on the server. Use a trusted LAN or HTTPS. Restart after changing.
  kiosk_satellite_password:
    name: Kiosk Satellite Remote Administration password
    description: Optional password for automatic Remote API login at startup and token renewal while running, with either alarm backend. Takes precedence over the manual token. Stored in the HA app options, never sent to the browser. This grants powerful admin access; use a trusted LAN or HTTPS. Failed logins back off; alarm changes and installations are never automatically replayed. Restart after changing.
  kiosk_satellite_alarm_ui:
    name: Kiosk alarm ringing UI
    description: native keeps KS controls. clock requests Clock Radio's ringing and snooze UI only on the configured KS device, with native timing/playback and automatic native-screen fallback. Requires KS dashboard-alarm support and its Dashboard alarm UI URL setting. Older KS versions retain native controls. Unrelated or mixed native alarm groups are never taken over. Restart after changing.
  music_assistant_url:
    name: Music Assistant address
    description: Optional HTTP(S) address, usually http://homeassistant:8095. A running HA app is discovered automatically when a token is provided. Restart after changing.
  music_assistant_token:
    name: Music Assistant read-only token
    description: Create a read-only access token in Music Assistant under Settings > Profile. Required for library browsing, not HA radio presets. Kept on the server. Restart after changing.
