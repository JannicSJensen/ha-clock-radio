name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clock-radio/app/package-lock.json
      - run: npm ci && npm run check && npm test
        working-directory: clock-radio/app
  lint:
    name: Home Assistant app linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./clock-radio
  build:
    name: Build app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_VERSION=ci --build-arg BUILD_ARCH=amd64 ./clock-radio
